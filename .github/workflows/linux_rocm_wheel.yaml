name: Build and test Linux ROCm wheels

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      - release/*
    tags:
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@release/2.10
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.10
      with-cpu: disable
      with-xpu: disable
      with-rocm: enable
      with-cuda: disable
      build-python-only: "disable"
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
    name: Build and Upload wheel
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@release/2.10
    with:
      repository: meta-pytorch/torchcodec
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.10
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      pre-script: packaging/pre_build_script.sh
      post-script: packaging/post_build_script.sh
      smoke-test-script: packaging/fake_smoke_test.py
      package-name: torchcodec
      trigger-event: ${{ github.event_name }}
      build-platform: "python-build-package"
      build-command: "BUILD_AGAINST_ALL_FFMPEG_FROM_S3=1 ENABLE_ROCM=1 python -m build --wheel -vvv --no-isolation"

  install-and-test:
    runs-on: linux.rocm.gpu
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        # ROCm versions to test against
        rocm-version: ['7.2']
        # TODO: put back ffmpeg 5 https://github.com/pytorch/torchcodec/issues/325
        ffmpeg-version-for-tests: ['4.4.2', '5', '6', '7', '8.0']

    container:
      image: "rocm/pytorch:rocm${{ matrix.rocm-version }}_ubuntu22.04_py${{ matrix.python-version }}_pytorch_release"
      options: "--device=/dev/kfd --device=/dev/dri --group-add video"
    needs: build
    steps:
      - name: Setup env vars
        run: |
          rocm_version_without_periods=$(echo "${{ matrix.rocm-version }}" | sed 's/\.//g')
          echo rocm_version_without_periods=${rocm_version_without_periods} >> $GITHUB_ENV
          python_version_without_periods=$(echo "${{ matrix.python-version }}" | sed 's/\.//g')
          echo python_version_without_periods=${python_version_without_periods} >> $GITHUB_ENV

      - name: Check out repo
        uses: actions/checkout@v3

      - name: Remove src/ folder
        run: bash packaging/remove_src.sh

      - name: Setup miniconda using test-infra
        uses: pytorch/test-infra/.github/actions/setup-miniconda@main
        with:
          python-version: ${{ matrix.python-version }}
          # Install ROCm-compatible packages and FFmpeg
          default-packages: "conda-forge::ffmpeg=${{ matrix.ffmpeg-version-for-tests }}"
      - name: Check env, set LD_LIBRARY_PATH
        run: |
          ${CONDA_RUN} env
          ${CONDA_RUN} conda info
          ${CONDA_RUN} rocm-smi
          ${CONDA_RUN} conda list
          echo LD_LIBRARY_PATH=$CONDA_PREFIX/lib:/opt/rocm/lib:${LD_LIBRARY_PATH} >> $GITHUB_ENV
      - name: Assert ffmpeg exists
        run: |
          ${CONDA_RUN} ffmpeg -buildconf
      - name: Update pip
        run: ${CONDA_RUN} python -m pip install --upgrade pip
      - name: Install PyTorch
        run: |
          ${CONDA_RUN} bash packaging/install_pytorch.sh rocm${{ env.rocm_version_without_periods }} "torch torchvision"
          ${CONDA_RUN} python -c 'import torch; print(f"{torch.__version__}"); print(f"{torch.__file__}"); print(f"{torch.cuda.is_available()=}")'

      - uses: actions/download-artifact@v4
        with:
          name: meta-pytorch_torchcodec__${{ matrix.python-version }}_rocm${{ env.rocm_version_without_periods }}_x86_64
          path: dist/

      - name: Install torchcodec from the wheel
        run: ${CONDA_RUN} bash packaging/install_torchcodec_wheel.sh "*rocm${{ env.rocm_version_without_periods }}-cp${{ env.python_version_without_periods }}*.whl"

      - name: Install test dependencies
        run: ${CONDA_RUN} bash packaging/install_test_dependencies.sh
      - name: Run Python tests
        run: |
          ${CONDA_RUN} FAIL_WITHOUT_ROCM=1 pytest --override-ini="addopts=-v" test --tb=short
      - name: Run Python benchmark
        run: |
          ${CONDA_RUN} time python benchmarks/decoders/gpu_benchmark.py --devices=cuda:0,cpu --resize_devices=none
